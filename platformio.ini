[platformio]
default_envs = m5sticks3

[env:m5sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

; 浏览器烧录：pio run -e m5sticks3 -t webflash → webflash/firmware.bin
extra_scripts = post:scripts/prepare_webflash.py

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DESP32S3
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -I include

lib_deps =
    m5stack/M5Unified @ ^0.2.12
    m5stack/M5PM1

monitor_filters = esp32_exception_decoder, time